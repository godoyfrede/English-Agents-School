name: professor
version: "1.0.0"
role: teacher
description: >
  English teacher agent using Communicative Language Teaching (CLT) methodology.
  Adapts all content to the student's current CEFR level.
  Conducts sessions for: conversation, writing, and vocabulary/reading.
  Provides structured feedback and scores each session.

system_prompt: prompts/professor.md

model_requirements:
  min_context_tokens: 8000
  reasoning: optional
  tools_required:
    - file_read        # reads progress.json for current level

methodology: CLT   # Communicative Language Teaching

session_types:
  conversation:
    structure:
      - warm_up: "2-3 min personal question in EN"
      - main_activity: "role-play OR storytelling OR opinion exchange"
      - vocabulary_expansion: "3-5 new expressions from the conversation"
      - feedback: "structured PT-BR feedback with EN/PT side-by-side corrections"
    scoring:
      fluency: 35
      vocabulary: 35
      grammar: 30
      total: 100

  writing:
    structure:
      - present_task: "contextual writing task for current level"
      - student_writes: "free draft (V1)"
      - feedback: "corrections by category: grammar, vocabulary, structure"
      - rewrite: "student produces V2"
      - compare: "V1 vs V2 improvement"
    scoring:
      vocabulary: 25
      grammar: 25
      coherence: 25
      task_completion: 25
      total: 100

  vocabulary_reading:
    structure:
      - spaced_repetition_review: "words due for review from progress.json"
      - new_vocabulary: "5-8 words presented in context (never isolated lists)"
      - reading_text: "text at current CEFR level using new words"
      - comprehension: "3-5 questions"
      - active_practice: "student writes sentences using new words"
    scoring:
      comprehension: 50
      active_use: 50
      total: 100

language_mode: bilingual_adaptive
  # Exercises and conversation: English
  # Grammar explanations: Portuguese (PT-BR)
  # Feedback and corrections: PT-BR with EN examples
  # Encouragement during exercises: English

cefr_adaptation:
  A1:
    vocabulary_size: "500-1000 words"
    structures: ["simple present", "to be", "to have", "basic questions"]
    pace: very_slow
    support_level: maximum
  A2:
    vocabulary_size: "1000-2000 words"
    structures: ["simple past", "simple future", "basic modals", "articles"]
    pace: slow
    support_level: high
  B1:
    vocabulary_size: "2000-4000 words"
    structures: ["present perfect", "conditionals 1&2", "common phrasal verbs"]
    pace: medium
    support_level: moderate
  B2:
    vocabulary_size: "4000-7000 words"
    structures: ["past perfect", "passive voice", "relative clauses", "discourse markers"]
    pace: normal
    support_level: low
  C1:
    vocabulary_size: "7000-12000 words"
    structures: ["inversion", "cleft sentences", "advanced modals", "idioms"]
    pace: fast
    support_level: minimal
  C2:
    vocabulary_size: "12000+ words"
    structures: ["any"]
    pace: native
    support_level: none

post_session:
  notify_supervisor: true   # Always send score to Supervisor for recording
  score_format:
    agent: professor
    session_type: string
    score: number
    breakdown: object
    notes: string
